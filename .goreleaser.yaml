---
version: 2
builds:
  - env:
      - CGO_ENABLED=0
    main: ./cli/
    mod_timestamp: '{{ .CommitTimestamp }}'
    ldflags:
      - '-s -w'
      - -X github.com/drewstinnett/sourceseedy/cli/cmd.date={{ .CommitDate }}
      - -X github.com/drewstinnett/sourceseedy/cli/cmd.version={{ .Tag }}
      - -X github.com/drewstinnett/sourceseedy/cli/cmd.commit={{ .ShortCommit }}
    flags:
      - -trimpath
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: darwin
        goarch: '386'
    binary: 'sourceseedy'
archives:
  - formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: 'sourceseedy-{{ .Version }}_{{ if eq .Os "darwin" }}macOS{{ else }}{{ .Os }}{{ end }}_{{ .Arch }}'
checksum:
  name_template: 'sourceseedy-{{ .Version }}_SHA256SUMS'
  algorithm: sha256
snapshot:
  version_template: "{{ .Tag }}-snapshot"
# Release notes are built from the commits since the last tag, and this repo
# uses conventional commits. Merges and build/CI changes are left out
changelog:
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Everything else
      order: 2
  filters:
    exclude:
      - '^Merge '
      - '^(ci|build)(\([[:word:]]+\))??!?:'
